<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script>
'use strict';
const W = 1920, H = 1080, TAU = Math.PI * 2, D2R = Math.PI / 180;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
let TL = null;

const C = {
  bg: '#05090f', text: '#e9f0f8', muted: '#8fa3b9', dim: '#4a5d72',
  cyan: '#4fd1ff', green: '#46f0a6', amber: '#ffb547', red: '#ff5d5d',
  violet: '#a18bff', steel: '#7d93ab', edge: '#9fb3c8', white: '#ffffff',
};
const F = { ui: 'Inter', disp: '"Inter Display"', mono: '"JetBrains Mono"' };

// ---------- helpers ----------
function hexA(h, a) { const n = parseInt(h.slice(1), 16); return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a})`; }
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const lerp = (a, b, t) => a + (b - a) * t;
const prog = (t, a, d) => clamp((t - a) / d);
const sm = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const eo = t => { t = clamp(t); return 1 - Math.pow(1 - t, 3); };
const eio = t => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
// fade-in at a, fade-out at b
const fio = (t, a, b, fi = 0.5, fo = 0.5) => sm(prog(t, a, fi)) * (1 - sm(prog(t, b, fo)));
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const cue = (sc, i) => sc.lines[i].start;
const cend = (sc, i) => sc.lines[i].end;

function T(s, x, y, o = {}) {

  ctx.fillStyle = o.c || C.text; ctx.textAlign = o.al || 'left'; ctx.textBaseline = o.bl || 'alphabetic';
  ctx.letterSpacing = (o.ls || 0) + 'px';

}
function tw(s, o = {}) { ctx.save(); ctx.font = `${o.w || 600} ${o.size || 32}px ${o.f || F.ui}`; ctx.letterSpacing = (o.ls || 0) + 'px'; const w = ctx.measureText(s).width; ctx.restore(); return w; }
function glow(x, y, r, col, a) {

  g.addColorStop(0, hexA(col, a)); g.addColorStop(0.35, hexA(col, a * 0.45)); g.addColorStop(1, hexA(col, 0));

}
function line(x1, y1, x2, y2, col, lw = 2, a = 1, dash = null) {
  if (a <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = col; ctx.lineWidth = lw; ctx.lineCap = 'round';
  if (dash) ctx.setLineDash(dash);

}
function arrow(x1, y1, x2, y2, col, lw = 3, head = 16, a = 1, dash = null) {

}

}
function callout(x1, y1, x2, y2, label, col, a, al = 'left') {

}
function header(label, a) {
  if (a <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = C.cyan; ctx.fillRect(96, 78, 6, 30); ctx.restore();
  T(label, 118, 102, { f: F.mono, size: 24, w: 700, c: C.text, ls: 4, a });
}
function polyPath(pts, mx = 1) { ctx.beginPath(); pts.forEach((p, i) => i ? ctx.lineTo(p[0] * mx, p[1]) : ctx.moveTo(p[0] * mx, p[1])); ctx.closePath(); }
function wrapLines(text, maxW, font) {
  ctx.save(); ctx.font = font; const words = text.split(' '); const out = []; let cur = '';
  for (const w of words) { const t = cur ? cur + ' ' + w : w; if (ctx.measureText(t).width > maxW && cur) { out.push(cur); cur = w; } else cur = t; }
  if (cur) out.push(cur);

    let best = null; for (let k = 1; k < words.length; k++) { const a = words.slice(0, k).join(' '), b = words.slice(k).join(' '); const m = Math.max(ctx.measureText(a).width, ctx.measureText(b).width); if (m <= maxW && (!best || m < best.m)) best = { m, a, b }; }
    if (best) { ctx.restore(); return [best.a, best.b]; }

// ---------- ray tracing (2D) ----------

  const wx = s[0] - p[0], wy = s[1] - p[1]; const t = (wx * ey - wy * ex) / den; const u = (wx * d[1] - wy * d[0]) / den;

    if (!bn) { pts.push([p[0] + dir[0] * far, p[1] + dir[1] * far]); break; }

// draw polyline path up to length L; segStyle(i) -> {c, a, lw}
function drawPath(pts, L, segStyle, headCol) {

// ---------- backgrounds ----------
let BG, BG_STARS;
function noiseDither(g, amt) {
  const id = g.getImageData(0, 0, W, H); const d = id.data; const r = rng(7);
  for (let i = 0; i < d.length; i += 4) { const n = (r() - 0.5) * amt; d[i] += n; d[i + 1] += n; d[i + 2] += n; }
  g.putImageData(id, 0, 0);
}
function makeBg(stars) {
  const c = document.createElement('canvas'); c.width = W; c.height = H; const g = c.getContext('2d');
  g.fillStyle = C.bg; g.fillRect(0, 0, W, H);
  const rg = g.createRadialGradient(W / 2, H * 0.42, 0, W / 2, H * 0.42, W * 0.72);
  rg.addColorStop(0, stars ? '#0b1626' : '#0d1b2d'); rg.addColorStop(1, 'rgba(5,9,15,0)'); g.fillStyle = rg; g.fillRect(0, 0, W, H);
  if (stars) {
    const r = rng(42);
    for (let i = 0; i < 420; i++) { const x = r() * W, y = r() * H, s = r() < 0.08 ? 1.8 : 1.0, a = 0.15 + r() * 0.55; g.fillStyle = `rgba(210,225,255,${a})`; g.beginPath(); g.arc(x, y, s, 0, TAU); g.fill(); }
    const hg = g.createLinearGradient(0, H * 0.7, 0, H); hg.addColorStop(0, 'rgba(30,60,110,0)'); hg.addColorStop(1, 'rgba(30,70,130,0.22)'); g.fillStyle = hg; g.fillRect(0, 0, W, H);
  } else {
    g.strokeStyle = 'rgba(120,170,220,0.045)'; g.lineWidth = 1;
    for (let x = 0; x <= W; x += 60) { g.beginPath(); g.moveTo(x + .5, 0); g.lineTo(x + .5, H); g.stroke(); }
    for (let y = 0; y <= H; y += 60) { g.beginPath(); g.moveTo(0, y + .5); g.lineTo(W, y + .5); g.stroke(); }
  }
  const vg = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)'); g.fillStyle = vg; g.fillRect(0, 0, W, H);

}

// ---------- aircraft ----------
// B-2 planform (meters). Nose at (0,0), +y is aft. Leading edges swept 33 deg; every trailing-edge
// segment is parallel to one of the two leading edges.
const B2P = [[0, 0], [26.2, 17.0], [26.2, 18.2], [19.5, 22.55], [8.56, 15.45], [0, 21.0], [-8.56, 15.45], [-19.5, 22.55], [-26.2, 18.2], [-26.2, 17.0]];
const B2E = [[0, 1, 'B'], [1, 2, 'T'], [2, 3, 'A'], [3, 4, 'B'], [4, 5, 'A'], [5, 6, 'B'], [6, 7, 'A'], [7, 8, 'B'], [8, 9, 'T'], [9, 0, 'A']];
const B2BODY = [[0, 0.8], [2.6, 3.2], [5.2, 7], [7.2, 11.5], [7.0, 14.6], [4.5, 18.2], [0, 20.0], [-4.5, 18.2], [-7.0, 14.6], [-7.2, 11.5], [-5.2, 7], [-2.6, 3.2]];
const B2INL = [[3.4, 8.4], [4.3, 7.2], [5.3, 8.0], [6.3, 7.3], [7.6, 8.9], [7.2, 9.8], [3.8, 9.6]];
const B2EXH = [[3.1, 14.4], [6.6, 13.4], [7.6, 16.07], [3.0, 19.05]];
const B2WIN = [[[0.25, 2.55], [1.15, 2.85], [1.05, 3.55], [0.2, 3.35]], [[1.35, 2.95], [2.15, 3.5], [1.85, 4.05], [1.2, 3.7]]];
const B2CY = 12;
function b2pt(x, y, s, rot, px, py) { const X = px * s, Y = (py - B2CY) * s; const c = Math.cos(rot), si = Math.sin(rot); return [x + X * c - Y * si, y + X * si + Y * c]; }
function drawB2Top(x, y, s, rot = 0, o = {}) {
  const a = o.a ?? 1; if (a <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s); ctx.translate(0, -B2CY);
  ctx.lineJoin = 'round';
  polyPath(B2P); const g = ctx.createLinearGradient(0, 0, 0, 22); g.addColorStop(0, '#36404f'); g.addColorStop(1, '#181e28'); ctx.fillStyle = g; ctx.fill();

  ctx.strokeStyle = 'rgba(160,180,205,0.10)'; ctx.lineWidth = 1 / s; polyPath(B2BODY); ctx.stroke();

    polyPath(B2INL, m); ctx.fillStyle = '#0d121a'; ctx.fill(); ctx.strokeStyle = o.inl ? hexA(C.cyan, o.inl) : 'rgba(150,170,200,0.25)'; ctx.lineWidth = (o.inl ? 3 : 1) / s; ctx.stroke();
    polyPath(B2EXH, m); ctx.fillStyle = '#1a212c'; ctx.fill(); ctx.strokeStyle = 'rgba(150,170,200,0.18)'; ctx.lineWidth = 1 / s; ctx.stroke();

    ctx.save(); ctx.globalAlpha *= o.eng;
    for (const ex of [4.3, 6.4, -4.3, -6.4]) {
      ctx.beginPath(); ctx.roundRect(ex - 0.75, 8.8, 1.5, 5.6, 0.75); ctx.fillStyle = 'rgba(255,181,71,0.22)'; ctx.fill();
      ctx.setLineDash([0.5, 0.35]); ctx.strokeStyle = C.amber; ctx.lineWidth = 2.2 / s; ctx.stroke(); ctx.setLineDash([]);

}
// generic conventional bomber, top view (meters, nose at 0, +y aft)
function drawBomberTop(x, y, s, o = {}) {
  const a = o.a ?? 1; if (a <= 0.001) return;
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s); ctx.translate(0, -25);

  for (const m of [1, -1]) {
    polyPath([[1.6, 16.5], [28.2, LE(28.2)], [28.2, LE(28.2) + 3.6], [1.6, 30]], m); ctx.fill();

  for (const px of [8.5, 17.5, -8.5, -17.5]) { const ly = LE(px); ctx.beginPath(); ctx.roundRect(px - 1.1, ly - 4.5, 2.2, 7, 1); ctx.fill(); }

  ctx.fillStyle = '#2a3442'; ctx.fillRect(-0.3, 37, 0.6, 12);

}
// generic jet, side view, nose pointing left (meters)
function drawJetSide(x, y, s, o = {}) {

  ctx.fillStyle = '#4a5768'; polyPath([[15, 0], [21, 0], [22, -0.6], [17, -1.2]]); ctx.fill();
  const g = ctx.createLinearGradient(0, -2.2, 0, 2.2); g.addColorStop(0, '#a9b6c6'); g.addColorStop(1, '#5f6c7e');
  ctx.beginPath(); ctx.moveTo(-20, 0.3); ctx.bezierCurveTo(-20, -1.6, -17, -2.2, -14, -2.2); ctx.lineTo(16, -2.2); ctx.lineTo(21, -1.3); ctx.lineTo(21, 0.2); ctx.lineTo(15, 2.1); ctx.lineTo(-14, 2.1); ctx.bezierCurveTo(-17.5, 2.1, -20, 1.5, -20, 0.3); ctx.closePath(); ctx.fillStyle = g; ctx.fill();

  ctx.fillStyle = '#1b2433'; polyPath([[-18.6, -0.9], [-16.6, -1.6], [-16.2, -0.9]]); ctx.fill();

function drawRadarSite(x, y, s, aimAng, a = 1, col = C.cyan) {

  ctx.save(); ctx.globalAlpha *= a; ctx.translate(x, y); ctx.scale(s, s);
  ctx.fillStyle = '#2a3646'; polyPath([[-18, 0], [18, 0], [7, -50], [-7, -50]]); ctx.fill();
  ctx.strokeStyle = 'rgba(160,190,220,0.35)'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-14, -8); ctx.lineTo(5, -45); ctx.moveTo(14, -8); ctx.lineTo(-5, -45); ctx.stroke();
  ctx.translate(0, -58); ctx.rotate(aimAng);
  ctx.beginPath(); ctx.moveTo(-6, -34); ctx.quadraticCurveTo(14, 0, -6, 34); ctx.lineTo(-11, 34); ctx.quadraticCurveTo(8, 0, -11, -34); ctx.closePath(); ctx.fillStyle = '#b8c6d6'; ctx.fill();
  ctx.strokeStyle = '#8fa3b9'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(-2, -26); ctx.lineTo(26, 0); ctx.lineTo(-2, 26); ctx.stroke();

}
function ground(y, a = 1) {

  for (let x = 0; x <= W; x += 40) ctx.lineTo(x, y - 18 * Math.sin(x * 0.004) - 10 * Math.sin(x * 0.011 + 1) - r() * 4);
  ctx.lineTo(W, H); ctx.closePath();

  ctx.strokeStyle = 'rgba(120,170,220,0.18)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
}

// ---------- radar scope ----------
function drawScope(cx, cy, R, ang, a, blips, labelA = 1) {
  if (a <= 0.001) return;

  const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, R); g.addColorStop(0, '#062a1d'); g.addColorStop(1, '#03150f');
  ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.fillStyle = g; ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, R, 0, TAU); ctx.clip();

// ---- 2. Radar basics ----
function radarGeom(sc) {

  return { rx, ry, te, ta, tr, ax, ay, D, v };

  }
  if (lt > g.tr) glow(g.rx, g.ry - 10, 120, C.green, 0.7 * Math.exp(-(lt - g.tr) * 1.8));
  // timer HUD

    const f = clamp((lt - g.te) / (g.tr - g.te)); const us = Math.round(200 * f);

    T(`${String(us).padStart(3, '0')} µs`, 1215, 720, { f: F.mono, size: 58, w: 700, c: f >= 1 ? C.green : C.text, a: hA });

  conv.kinds = ['fus', 'wing', 'wing', 'nac', 'nac', 'nac', 'nac', 'pyl', 'pyl', 'pyl', 'pyl', 'fin', 'stab'];

  }
  // three extra tactics
  const items = [
    ['ROUTE PLANNING', 'fly around known radars', (x, y, a) => { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = hexA(C.red, 0.7); ctx.lineWidth = 2; for (const [px, py] of [[-30, -10], [35, 25]]) { ctx.beginPath(); ctx.arc(x + px, y + py, 28, 0, TAU); ctx.fillStyle = hexA(C.red, 0.15); ctx.fill(); ctx.stroke(); } ctx.setLineDash([8, 7]); ctx.strokeStyle = C.green; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x - 75, y + 40); ctx.bezierCurveTo(x - 20, y + 50, x - 10, y - 40, x + 75, y - 40); ctx.stroke(); ctx.restore(); }],
    ['QUIET EMISSIONS', 'minimal radio & radar use', (x, y, a) => { ctx.save(); ctx.globalAlpha *= a; ctx.strokeStyle = C.cyan; ctx.lineWidth = 3.5; ctx.beginPath(); ctx.moveTo(x, y + 45); ctx.lineTo(x, y - 20); ctx.stroke(); for (const r of [22, 40, 58]) { ctx.beginPath(); ctx.arc(x, y - 20, r, -Math.PI * 0.8, -Math.PI * 0.2); ctx.stroke(); } ctx.strokeStyle = C.red; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(x - 60, y + 40); ctx.lineTo(x + 60, y - 70); ctx.stroke(); ctx.restore(); }],
    ['NIGHT MISSIONS', 'dark sky, dark paint', (x, y, a) => { ctx.save(); ctx.globalAlpha *= a; ctx.fillStyle = '#dfe8ff'; ctx.beginPath(); ctx.arc(x, y - 10, 40, 0, TAU); ctx.fill(); ctx.globalCompositeOperation = 'destination-out'; ctx.beginPath(); ctx.arc(x + 20, y - 24, 36, 0, TAU); ctx.fill(); ctx.restore(); for (const [sx, sy] of [[45, -45], [60, 10], [-55, 30]]) glow(x + sx, y + sy, 10, '#dfe8ff', 0.9 * a); }],

  items.forEach((it, i) => {

    const x = 420 + i * 540, y = 540 + 30 * (1 - a);

    it[2](x, y - 50, a);
    T(it[0], x, y + 100, { f: F.mono, size: 26, w: 700, c: C.text, al: 'center', ls: 4, a });
    T(it[1], x, y + 145, { size: 26, w: 500, c: C.muted, al: 'center', a });
  });
};

// ---- 10. Recap ----
SC.recap = (lt, sc) => {
  const c0 = cue(sc, 0), e0 = cend(sc, 0), c1 = cue(sc, 1);
  const items = [['01', 'Shape', 'deflect', iconShape, C.cyan], ['02', 'Edges', 'align', iconEdges, C.amber], ['03', 'Skin', 'absorb', iconSkin, C.violet], ['04', 'Engines', 'hide', iconEngine, C.green]];
  const up = eio(prog(lt, c1 - 0.2, 1.2));
  const endA = sm(prog(lt, sc.dur - 4.4, 0.8));
  items.forEach((it, i) => {
    const a = eo(prog(lt, c0 + (e0 - c0) * i / 4 - 0.1, 0.45)) * (1 - endA);
    const x = 375 + i * 390, y = lerp(540, 300, up), sc2 = lerp(1, 0.72, up);
    card(x, y, 330 * sc2, 380 * sc2, it[0], it[1], it[2], it[3], it[4], a);
  });
  // B-2 fly-through with radar scope
  const fA = sm(prog(lt, c1 + 0.2, 0.8)) * (1 - endA);
  if (fA > 0) {
    const f = (lt - c1) / (sc.dur - 4.4 - c1);
    drawB2Top(lerp(-200, 2100, f), lerp(860, 600, f), 6, Math.PI / 2 - 0.12, { a: fA });
  }
  if (endA > 0) {
    glow(960, 470, 500, '#2a5db0', 0.12 * endA);
    drawB2Top(960, 420, 15, 0, { a: endA });
    T('B-2 SPIRIT', 960, 760, { f: F.mono, size: 34, w: 700, c: C.cyan, al: 'center', ls: 14, a: endA });
    T('Shape · Edges · Skin · Engines', 960, 840, { f: F.disp, size: 56, w: 800, al: 'center', a: endA });
    T('RCS figures shown are public, unclassified estimates.', 960, 1000, { size: 22, w: 500, c: C.dim, al: 'center', a: endA });
  }
};

// =====================================================================
// captions + main render
// =====================================================================
let LINES = [];
function drawCaption(t) {
  const L = LINES.find(l => t >= l.a - 0.1 && t <= l.b + 0.35); if (!L) return;
  const a = sm(prog(t, L.a - 0.1, 0.2)) * (1 - sm(prog(t, L.b + 0.1, 0.25)));
  if (a <= 0.001) return;
  const font = '600 34px Inter'; const lines = wrapLines(L.text, 1400, font);
  ctx.save(); ctx.font = font; const wmax = Math.max(...lines.map(s => ctx.measureText(s).width)); ctx.restore();
  const lh = 46, h = lines.length * lh + 28, y0 = H - 50 - h;
  ctx.save(); ctx.globalAlpha = a; rrect(W / 2 - wmax / 2 - 30, y0, wmax + 60, h, 14); ctx.fillStyle = 'rgba(3,6,11,0.78)'; ctx.fill(); ctx.restore();
  lines.forEach((s, i) => T(s, W / 2, y0 + 14 + lh * (i + 1) - 12, { size: 34, w: 600, al: 'center', a, c: '#f4f7fb' }));
}
function render(t) {
  const scs = TL.scenes; let i = scs.findIndex(s => t >= s.start && t < s.start + s.dur); if (i < 0) i = scs.length - 1;
  const sc = scs[i], lt = t - sc.start;
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.setLineDash([]);
  ctx.drawImage((sc.id === 'title' || sc.id === 'recap') ? BG_STARS : BG, 0, 0);
  const z = 1 + 0.018 * (lt / sc.dur);
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  SC[sc.id](lt, sc);
  ctx.restore();
  const fin = i === 0 ? 1.0 : 0.45, fout = i === scs.length - 1 ? 1.6 : 0.45;
  const fa = Math.max(1 - clamp(lt / fin), clamp((lt - (sc.dur - fout)) / fout));
  if (fa > 0) { ctx.fillStyle = `rgba(0,0,0,${fa})`; ctx.fillRect(0, 0, W, H); }
  drawCaption(t);
}
// sound-effect cue list (absolute seconds), consumed by the audio mixer
function sfxEvents() {
  const ev = []; const S = id => TL.scenes.find(s => s.id === id);
  { const sc = S('title'); const c1 = cue(sc, 1); const b = TITLE_BLIPS[0]; for (let n = 0; n < 6; n++) { const lt = c1 + ((b.ang % TAU + TAU) % TAU + n * TAU) / TITLE_SWEEP; if (lt > c1 + 0.6 && lt < sc.dur - 0.5) ev.push({ t: sc.start + lt, k: 'blip' }); } }
  { const sc = S('radar'); const g = radarGeom(sc); ev.push({ t: sc.start + g.te, k: 'ping' }, { t: sc.start + g.ta, k: 'hit' }, { t: sc.start + g.tr, k: 'echo' }); }
  { const sc = S('shape'); ev.push({ t: sc.start + cue(sc, 1) + 0.6, k: 'ping' }, { t: sc.start + cue(sc, 3) + 0.4, k: 'ping' }, { t: sc.start + cue(sc, 1) + 2.5, k: 'echo' }); }
  for (const id of ['shape', 'edges', 'ram', 'engines']) { const sc = S(id); ev.push({ t: sc.start + 0.1, k: 'swell' }); }
  { const sc = S('ram'); ev.push({ t: sc.start + cue(sc, 1) + 0.3, k: 'ping' }); }
  { const sc = S('limits'); ev.push({ t: sc.start + cue(sc, 1) + 0.3, k: 'ping' }, { t: sc.start + cue(sc, 1) + 3.5, k: 'ping' }); }
  { const sc = S('recap'); ev.push({ t: sc.start + sc.dur - 4.4, k: 'boom' }); }
  return ev.sort((a, b) => a.t - b.t);
}
async function init(tl) {
  TL = tl;
  LINES = TL.scenes.flatMap(s => s.lines.map(l => ({ text: l.text, a: s.start + l.start, b: s.start + l.end })));
  await Promise.all(['600 34px Inter', '500 30px Inter', '700 30px Inter', '800 100px "Inter Display"', '700 24px "JetBrains Mono"', '600 24px "JetBrains Mono"'].map(f => document.fonts.load(f)));

window.render = render; window.init = init; window.sfxEvents = sfxEvents;
